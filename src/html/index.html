<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Agent Chat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Left Menu Bar -->
    <aside class="menu-bar" id="menuBar">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu-content" id="menuContent">
            <button class="menu-btn" id="dashboardBtn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h18v18H3zM3 12h18M12 3v18" />
                </svg>
                <span>Dashboard</span>
            </button>
            <button class="menu-btn" id="forecastsBtn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5a2 2 0 00-2 2v2z" />
                </svg>
                <span>My Forecasts</span>
            </button>
            <!-- Future menu buttons can go here -->
        </nav>
    </aside>

    <!-- Center Area (Empty) -->
    <main class="center-area">
        <div class="center-placeholder">Content area</div>
    </main>

    <!-- Right Chat Panel -->
    <aside class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <h1>My Agent</h1>
            <button class="close-chat-btn" id="closeChatBtn" aria-label="Close chat" onclick="toggleChatPanel()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                Hello! I'm your AI agent. How can I help you today?
            </div>
        </div>

        <!-- File Preview -->
        <div class="file-preview" id="filePreview" style="display: none; margin: 0 16px 10px;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
            </svg>
            <span class="file-name" id="filePreviewName"></span>
            <button class="remove-file" id="removeFileBtn" aria-label="Remove file">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <button class="attach-btn" id="attachBtn" aria-label="Attach file">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </button>
                <input type="file" id="fileInput" style="display: none;" accept=".txt,.pdf,.csv,.json,.md,.py,.js,.ts,.html,.css">
                <textarea
                    id="messageInput"
                    placeholder="Type your message..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12h12M12 6l6 6-6 6" />
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <div class="error-toast" id="errorToast"></div>
    <!-- Floating Chat Button -->
    <button class="float-chat-btn" id="floatChatBtn" aria-label="Open chat" onclick="toggleChatPanel()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
    </button>
    <script src="/script/script.js"></script>
    <script>
        function toggleChatPanel() {
            const chatPanel = document.getElementById('chatPanel');
            const floatChatBtn = document.getElementById('floatChatBtn');

            if (chatPanel.classList.contains('open')) {
                chatPanel.classList.remove('open');
                floatChatBtn.classList.remove('hidden');
            } else {
                chatPanel.classList.add('open');
                floatChatBtn.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
